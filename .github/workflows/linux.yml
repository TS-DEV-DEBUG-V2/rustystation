name: Build RustyStation (Linux)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SDL2 dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Build RustyStation
        run: cargo build --release

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: RustyStation-Linux
          path: target/release/
